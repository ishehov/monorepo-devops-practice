---
- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ nodejs_major_version }}.x"
    dest: "/tmp/nodesource_setup.sh"
    mode: "0755"

- name: Configure NodeSource repository
  ansible.builtin.command:
    cmd: "/tmp/nodesource_setup.sh"
  args:
    creates: "/etc/apt/sources.list.d/nodesource.sources"
  notify: Update apt package cache

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present