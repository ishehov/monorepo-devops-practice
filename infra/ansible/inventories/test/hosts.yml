---
all:
  vars:
    ansible_user: devops
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3.12

  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            test-cp-01:
              ansible_host: 192.168.1.200

        k3s_agents:
          hosts:
            test-worker-01:
              ansible_host: 192.168.1.201
            test-worker-02:
              ansible_host: 192.168.1.202