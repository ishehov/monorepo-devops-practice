name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      apps: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed applications
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
              - '.github/workflows/**'
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/**'

  test:
    name: Test applications
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test ${{ matrix.app }}
        run: npm test

  build:
    name: Build container images
    needs: [changes, test]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.app }} container image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ishehov/monorepo-devops-practice-${{ matrix.app }}:sha-${{ github.sha }}
            ghcr.io/ishehov/monorepo-devops-practice-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ishehov/monorepo-devops-practice
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs:
      - changes
      - test
      - build
    if: always()

    steps:
      - name: Check CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          echo "Changes: ${CHANGES_RESULT}"
          echo "Tests:   ${TEST_RESULT}"
          echo "Build:   ${BUILD_RESULT}"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi

          for result in "$TEST_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A required CI stage failed or was cancelled"
              exit 1
            fi
          done

          echo "CI passed"

