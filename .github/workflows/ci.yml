name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test applications
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - api-gateway
          - frontend

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: false
          tags: monorepo-devops-practice-api-gateway:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          tags: monorepo-devops-practice-frontend:ci

  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/ishehov/monorepo-devops-practice-api-gateway:sha-${{ github.sha }}
            ghcr.io/ishehov/monorepo-devops-practice-api-gateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ishehov/monorepo-devops-practice
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/ishehov/monorepo-devops-practice-frontend:sha-${{ github.sha }}
            ghcr.io/ishehov/monorepo-devops-practice-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ishehov/monorepo-devops-practice
            org.opencontainers.image.revision=${{ github.sha }}
