services:

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/seeds/dev_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootpassword}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    build:
      context: ./apps/api-gateway

    environment:
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      DB_NAME: ${DB_NAME:-app_db}

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend

    environment:
      PORT: 8080
      API_URL: http://localhost:3000

    ports:
      - "8080:8080"

    depends_on:
      - api-gateway

volumes:
  mysql_data: